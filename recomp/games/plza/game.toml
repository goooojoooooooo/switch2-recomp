# Z-A is a Game Freak (Trinity) engine title, not KTGL, so only the generic extractor can apply. It was written for NVN2 games;
# whether it finds Z-A's NVN1 shaders (inside romfs/arc/data.trpfs) is untested.
[shaders]
extractor = "generic"
extractor_script = "tools/shaders/scripts/extract_generic.py"

[launcher]
