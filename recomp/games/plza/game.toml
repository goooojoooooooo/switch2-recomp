#
# Game manifest of Pokémon Legends: Z-A (same format as recomp/games/pkp/game.toml; read there for every key's meaning).
#
# The dump block (BEGIN/END DUMP) is written by fill_manifest.py from the update v393216 exefs (the code that runs).
# platform: switch1. That exefs is a Switch 1 build even in the "Switch 2 Edition" package: NintendoSDK 19.3.11, NVN (not NVN2),
# main.npdm ThreadInfo cores 0..2. Modules: main, sdk, rtld (no subsdk).
# version: the update's title version number; the display version and languages need control.nacp, which the dump does not hold.
schema = 1

[game]
id = "plza"
title = "Pokémon Legends: Z-A"
short_title = "Legends Z-A"
product = "Pokémon Legends: Z-A PC"
title_id = "0100F43008C44000"
version = "393216"
platform = "switch1"
languages = 0x1ffff

[files]
exe = "plza.exe"
runtime_dll = "plza_rt.dll"
ini = "plza.ini"
log = "plza.log"
setup_exe = "plza_setup.exe"
launcher_ini = "plza_launcher.ini"
shader_pack = "shader_cache.plzashc"
save_folder = "LegendsZARecompPC"

